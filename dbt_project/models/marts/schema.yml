version: 2

models:
  - name: fact_daily_sales
    description: >
      Aggregated daily sales fact table joining sales, products, and reviews.
      This is the primary analytics table served by the Data Access API.
    columns:
      - name: date
        description: "The date of the sales"
        tests:
          - not_null
      - name: product_id
        description: "Product identifier"
        tests:
          - not_null
      - name: product_name
        description: "Name of the product"
        tests:
          - not_null
      - name: product_category
        description: "Category of the product"
      - name: total_quantity_sold
        description: "Total units sold for this product on this date"
        tests:
          - not_null
      - name: total_revenue
        description: "Total revenue from this product on this date"
        tests:
          - not_null
      - name: avg_review_rating
        description: "Average customer review rating for this product"
